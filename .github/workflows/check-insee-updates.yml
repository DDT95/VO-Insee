name: Vérifier les sources Insee

on:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          set +e
          OUTPUT=$(python3 scripts/check_sources.py)
          echo "$OUTPUT"
          CHANGED=$(echo "$OUTPUT" | grep '^CHANGED:' | cut -d: -f2)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Committer l'état des sources
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/.sources_state.json
          git diff --cached --quiet || git commit -m "chore: état des sources Insee (vérification automatique)"
          git push
      - name: Ouvrir une issue si une source a changé
        if: steps.check.outputs.changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const changed = "${{ steps.check.outputs.changed }}".split(",").filter(Boolean);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Mise à jour possible des sources Insee : ${changed.join(", ")}`,
              body: `Le contenu des pages sources suivantes a changé depuis la dernière vérification automatique :\n\n${changed.map((c) => `- \`${c}\``).join("\n")}\n\nÀ vérifier manuellement : un nouveau millésime est peut-être disponible. Voir \`data/sources.json\` pour le détail de chaque source.`,
              labels: ["données", "à vérifier"],
            });
